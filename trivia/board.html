<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream Trivia - Public Board</title>
    <!-- Pull styles directly from your local server or copy/paste trivia.css into your GitHub repo -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Change this from the localhost link to a local relative path -->
    <link rel="stylesheet" href="trivia.css"> 
    <!-- IMPORTANT: Point Socket.io to your public tunnel URL -->
    <script src="https://arcade-bridge.yourdomain.com/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="top-hud">
        <div class="hud-left">
            <div class="game-logo"><i class="fa-solid fa-chevron-right" style="color: var(--kick-green);"></i> BACON TRIVIA</div>
            <div class="hud-badge"><span class="hud-label">Best Record</span><span class="hud-value highlight" id="hud-best-record">RND 1</span></div>
            <div class="hud-badge"><span class="hud-label">Lives</span><span class="hud-value" id="hud-lives" style="font-size: 16px;">❤️❤️❤️</span></div>
        </div>
        <div class="hud-center">
            <div class="hud-badge"><div class="stars-container"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div></div>
        </div>
        <div class="hud-right">
            <div class="hud-badge"><span class="hud-label">Round</span><span class="hud-value highlight" id="hud-round-num" style="font-size:32px; color:var(--bacon-orange);">1</span></div>
        </div>
    </div>

    <div id="main-container">
        <div id="sidebar">
            <div class="sidebar-title" style="margin-top: 4px; border-bottom: 2px solid var(--kick-green); padding-bottom: 8px;">
                <span><i class="fa-solid fa-square" style="color:var(--kick-green); font-size:10px;"></i> BATTLE LEADERBOARD</span>
            </div>
            <div id="leaderboard-list" class="custom-scrollbar"><div class="waiting-msg">Awaiting Host Connection...</div></div>
            <div class="instructions-box" style="margin-top: auto;">
                <div style="width: 100%; text-align: center;"><span style="color: white; font-weight: 900; letter-spacing: 2px;">TYPE <span style="color:var(--kick-green);">A · B · C · D</span> IN CHAT</span></div>
            </div>
        </div>

        <div id="stage-wrapper">
            <div class="trivia-stage">
                <div class="trivia-header" style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-bottom: 10px;">
                    <div style="display: flex; justify-content: flex-start;">
                        <div class="category-badge"><span style="color:var(--kick-green); margin-right:8px;">></span> <span id="category-text">AWAITING HOST</span></div>
                    </div>
                    
                    <div id="battle-vs-header" style="display:none; align-items:center; justify-content:center; gap:15px; font-size:24px; font-weight:900; letter-spacing:1px; text-transform:lowercase;">
                        <img id="vs-host-img" src="" style="width:36px; height:36px; border-radius:50%; border:2px solid var(--kick-green); object-fit: cover; display: none;">
                        <span id="vs-host-name" style="color:white;">host</span>
                        <span style="color:#585c7b; font-size:16px; text-transform:lowercase;">vs</span>
                        <span id="vs-challenger-name" style="color:white;">challenger</span>
                        <img id="vs-challenger-img" src="" style="width:36px; height:36px; border-radius:50%; border:2px solid #3b82f6; object-fit: cover; display: none;">
                    </div>

                    <div style="display: flex; justify-content: flex-end;">
                        <div class="question-tracker"><span id="q-timer" style="color:var(--kick-green);">0s</span> <span style="margin: 0 10px; color:#585c7b;">|</span> Q<span id="current-q">0</span> / <span id="total-q">0</span></div>
                    </div>
                </div>

                <div id="battle-banner" style="display:none; font-size: 20px; font-weight: 900; letter-spacing: 2px; align-items: center; justify-content: center; gap: 15px; background: #0f1018; border: 2px solid var(--border-color); padding: 5px 20px; border-radius: 8px; margin-bottom: 10px;">
                    <span style="color: var(--kick-green);">HOST WINS:</span>
                    <span id="score-host" style="color: white; background: #1a1a1a; padding: 4px 10px; border-radius: 4px;">0</span>
                    <span style="color: #585c7b; font-size: 14px; margin: 0 15px;">|</span>
                    <span style="color: #3b82f6;">CHALLENGER WINS:</span>
                    <span id="score-challenger" style="color: white; background: #1a1a1a; padding: 4px 10px; border-radius: 4px;">0</span>
                </div>

                <div class="question-box">
                    <div id="question-text"><div style="color: var(--text-light); font-weight: 900; letter-spacing: 3px; font-size: 34px;">SYNCING WITH HOST...</div></div>
                    <div id="timer-bar-container"><div id="timer-bar-fill" style="transform: scaleX(0);"></div></div>
                </div>

                <div class="options-grid">
                    <div class="option-row" id="opt-A"><div class="letter-box">A</div><div class="option-text" id="text-A">...</div><div class="vote-count" id="votes-A">0 votes</div></div>
                    <div class="option-row" id="opt-B"><div class="letter-box">B</div><div class="option-text" id="text-B">...</div><div class="vote-count" id="votes-B">0 votes</div></div>
                    <div class="option-row" id="opt-C"><div class="letter-box">C</div><div class="option-text" id="text-C">...</div><div class="vote-count" id="votes-C">0 votes</div></div>
                    <div class="option-row" id="opt-D"><div class="letter-box">D</div><div class="option-text" id="text-D">...</div><div class="vote-count" id="votes-D">0 votes</div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Connect directly to your secure tunnel backend
        const socket = io('https://arcade-bridge.yourdomain.com');
        socket.emit('mirror_online');

        socket.on('mirror_sync_state', (data) => {
            document.getElementById('q-timer').innerText = data.qTimer;
            document.getElementById('current-q').innerText = data.currentQ;
            document.getElementById('total-q').innerText = data.totalQ;
            document.getElementById('category-text').innerText = data.categoryText;
            document.getElementById('question-text').innerHTML = data.questionText;
            document.getElementById('timer-bar-fill').style.transform = data.timerBarFill;
            
            document.getElementById('text-A').innerText = data.textA;
            document.getElementById('text-B').innerText = data.textB;
            document.getElementById('text-C').innerText = data.textC;
            document.getElementById('text-D').innerText = data.textD;
            
            document.getElementById('votes-A').innerText = data.votesA;
            document.getElementById('votes-B').innerText = data.votesB;
            document.getElementById('votes-C').innerText = data.votesC;
            document.getElementById('votes-D').innerText = data.votesD;
            
            document.getElementById('opt-A').className = data.classA;
            document.getElementById('opt-B').className = data.classB;
            document.getElementById('opt-C').className = data.classC;
            document.getElementById('opt-D').className = data.classD;
            
            document.getElementById('leaderboard-list').innerHTML = data.leaderboard;
            document.getElementById('hud-round-num').innerText = data.roundNum;
            document.getElementById('hud-lives').innerText = data.lives;
            document.getElementById('hud-best-record').innerText = data.bestRecord;

            const vsHeader = document.getElementById('battle-vs-header');
            const banner = document.getElementById('battle-banner');

            if (data.battleActive || data.showVsHeader) {
                vsHeader.style.display = 'flex';
                document.getElementById('vs-host-name').innerText = data.vsHostName;
                document.getElementById('vs-challenger-name').innerText = data.vsChallengerName;
                
                if (data.vsHostImg) {
                    const hi = document.getElementById('vs-host-img');
                    hi.src = data.vsHostImg;
                    hi.style.display = 'block';
                }
                if (data.vsChallengerImg) {
                    const ci = document.getElementById('vs-challenger-img');
                    ci.src = data.vsChallengerImg;
                    ci.style.display = 'block';
                }
            } else {
                vsHeader.style.display = 'none';
            }

            if (data.battleActive) {
                banner.style.display = 'flex';
                document.getElementById('score-host').innerText = data.scoreHost;
                document.getElementById('score-challenger').innerText = data.scoreChallenger;
            } else {
                banner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
